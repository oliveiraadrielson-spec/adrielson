
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro do Paraná</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agro do Paraná</h1>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section id="sobre">
        <h2>Sobre o Agro do Paraná</h2>
        <p>O Paraná é um dos principais estados agrícolas do Brasil, produzindo grãos, carnes e outros produtos de qualidade para o país e o mundo.</p>
    </section>

    <section id="produtos">
        <h2>Principais Produtos</h2>
        <div class="produtos-container" id="produtos-container">
            <!-- Produtos serão carregados pelo script.js -->
        </div>
    </section>

    <section id="contato">
        <h2>Contato</h2>
        <form id="form-contato">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required></textarea>

            <button type="submit">Enviar</button>
        </form>
        <p id="mensagem-sucesso" class="hidden">Mensagem enviada com sucesso!</p>
    </section>

    <footer>
        <p>© 2026 Agro do Paraná</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
